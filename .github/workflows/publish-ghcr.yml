name: Publish rating-sorting image

# Fork-only workflow. It is not part of the upstream pull request.
# The image is linux/amd64, which is what GitHub-hosted runners and this
# server can build. Upstream builds ARM on a self-hosted runner.

on:
  workflow_dispatch:
  push:
    branches:
      - deploy

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/calibre-web-automated" >> "$GITHUB_ENV"

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:rating-sorting
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=v4.0.8
          cache-from: type=gha
          cache-to: type=gha,mode=max
